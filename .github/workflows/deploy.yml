name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-frontend:
    name: Deploy frontend to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/configure-pages@v5
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "VITE_API_BASE_URL must be set in the github-pages Environment."
            exit 1
          fi
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-backend:
    name: Migrate D1 and deploy Worker
    runs-on: ubuntu-latest
    environment: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_SECRET_ADMIN_TOKEN: ${{ secrets.WORKER_SECRET_ADMIN_TOKEN }}
      WORKER_SECRETS_FILE: ${{ runner.temp }}/ratemycards-worker-secrets.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Type-check Worker
        working-directory: backend
        run: npm run typecheck
      - name: Apply pending D1 migrations
        working-directory: backend
        run: npm run migrate:remote
      - name: Create Worker secrets file
        run: >-
          node -e 'const { writeFileSync } = require("node:fs");
          const secrets = { ADMIN_TOKEN: process.env.WORKER_SECRET_ADMIN_TOKEN };
          const missing = Object.entries(secrets).filter(([, value]) => !value).map(([name]) => name);
          if (missing.length) throw new Error(`Missing required Worker secrets: ${missing.join(", ")}`);
          writeFileSync(process.env.WORKER_SECRETS_FILE, JSON.stringify(secrets), { mode: 0o600 });'
      - name: Deploy Worker and secrets
        working-directory: backend
        run: npm run deploy -- --secrets-file "$WORKER_SECRETS_FILE"
      - name: Remove Worker secrets file
        if: always()
        run: rm -f "$WORKER_SECRETS_FILE"
